services:
  # ==============================================================================
  # 1. Backend REST API Service
  # ==============================================================================
  - type: web
    name: ismael-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ismael-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_URL
        fromService:
          name: ismael-backend
          type: web
          property: host

  # ==============================================================================
  # 2. Frontend Public Next.js Website
  # ==============================================================================
  - type: web
    name: ismael-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ismael-backend.onrender.com/api
      - key: NEXT_PUBLIC_API_BASE
        value: https://ismael-backend.onrender.com

databases:
  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  - name: ismael-db
    plan: free
    databaseName: ismael_db
    user: postgres
